name: Build Skelly EQ
on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Package VST3
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter 'Skelly EQ.vst3' | Select-Object -First 1
          if (-not $plugin) { throw 'VST3 bundle not found' }
          Compress-Archive -Path $plugin.FullName -DestinationPath SkellyEQ-Windows-VST3.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SkellyEQ-Windows-VST3
          path: SkellyEQ-Windows-VST3.zip
          if-no-files-found: error
