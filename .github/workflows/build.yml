name: Build Skelly EQ
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: eq-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate V2.7 compact UI and safety checks
        run: python scripts/check_v27.py
      - name: Configure
        run: cmake -S . -B build -A x64 -DSKELLY_RESTORED_EDITOR=ON -DSKELLY_SAFE_EDITOR=ON -DSKELLY_TRACE_LIFECYCLE=OFF
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Run DSP regression tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Verify and stage VST3 bundle
        shell: pwsh
        run: |
          $plugins = @(Get-ChildItem -Path build -Recurse -Directory -Filter 'Skelly EQ.vst3')
          if ($plugins.Count -ne 1) { throw "Expected one VST3 bundle, found $($plugins.Count)" }
          $binary = Join-Path $plugins[0].FullName 'Contents/x86_64-win/Skelly EQ.vst3'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "Expected Windows VST3 binary missing: $binary"
          }
          $bytes = [System.IO.File]::ReadAllBytes($binary)
          if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Invalid Windows PE MZ header" }
          $offset = [BitConverter]::ToInt32($bytes, 0x3C)
          if ($offset -lt 0 -or ($offset + 4) -gt $bytes.Length -or
              $bytes[$offset] -ne 0x50 -or $bytes[$offset+1] -ne 0x45 -or
              $bytes[$offset+2] -ne 0 -or $bytes[$offset+3] -ne 0) { throw "Invalid Windows PE signature" }
          $hash = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash
          Write-Host "VST3 binary SHA256: $hash"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -LiteralPath $plugins[0].FullName -Destination dist -Recurse -Force
      - uses: actions/upload-artifact@v6
        with:
          name: SkellyEQ-V2.7-Windows-VST3
          path: dist/
          if-no-files-found: error
          retention-days: 7
