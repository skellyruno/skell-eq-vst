name: Build Skelly EQ (Windows VST3)
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release/eq-safe-windows-vst3-preview-validation-20261118
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: skelly-eq-${{ github.workflow }}-${{ github.ref }}
  # Supersede only PR validation; never cancel main pushes or manual runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
      - name: Resolve exact source commit for package provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $parents = (git show -s --format=%P HEAD).Trim() -split ' '
            if ($parents.Count -lt 2) { throw 'Pull request merge commit has no second parent.' }
            $sourceCommit = $parents[1]
          } else {
            $sourceCommit = (git rev-parse HEAD).Trim()
          }
          if ($sourceCommit.Length -ne 40 -or $sourceCommit -match '[^0-9a-f]') { throw "Could not resolve a full source commit SHA: $sourceCommit" }
          "SOURCE_COMMIT=$sourceCommit" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Package source commit: $sourceCommit"

      - name: Validate release source and stable program name
        run: python scripts/check_release_source.py

      - name: Validate V2.7 compact UI and safety checks
        run: python scripts/check_v27.py

      - name: Test VST3 metadata normalizer
        run: python scripts/normalize_vst3_moduleinfo.py --self-test

      - name: Configure
        run: cmake -S . -B build -A x64 -DSKELLY_RESTORED_EDITOR=ON -DSKELLY_SAFE_EDITOR=ON -DSKELLY_TRACE_LIFECYCLE=OFF

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Run DSP regression tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage and verify one flat Windows VST3 bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundles = @(Get-ChildItem -Path build -Directory -Recurse -Filter 'Skelly EQ.vst3' | Where-Object { $_.FullName -match '[\\/]Release[\\/]' })
          if ($bundles.Count -ne 1) { throw "Expected exactly one Release Skelly EQ.vst3 bundle; found $($bundles.Count)" }
          $plugin = $bundles[0]
          $moduleDir = Join-Path $plugin.FullName 'Contents/x86_64-win'
          $binary = Join-Path $moduleDir 'Skelly EQ.vst3'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw "Windows VST3 module missing: $binary" }
          $modules = @(Get-ChildItem -LiteralPath $moduleDir -File -Filter '*.vst3')
          if ($modules.Count -ne 1 -or $modules[0].Name -ne 'Skelly EQ.vst3') { throw "Expected exactly one x64 EQ module; found $($modules.Count)" }

          $bytes = [System.IO.File]::ReadAllBytes($binary)
          if ($bytes.Length -lt 512 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Invalid Windows PE DOS signature' }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          if ($peOffset -lt 0x40 -or ($peOffset + 24) -gt $bytes.Length -or
              [Text.Encoding]::ASCII.GetString($bytes, $peOffset, 4) -ne ("PE" + [char]0 + [char]0)) {
            throw 'Invalid Windows PE signature'
          }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          $optionalMagic = [BitConverter]::ToUInt16($bytes, $peOffset + 24)
          if ($machine -ne 0x8664) { throw "Expected AMD64 PE machine, got $machine" }
          if ($optionalMagic -ne 0x20B) { throw "Expected PE32+ optional header, got $optionalMagic" }

          $info = Join-Path $plugin.FullName 'Contents/Resources/moduleinfo.json'
          if (-not (Test-Path -LiteralPath $info -PathType Leaf)) { throw 'VST3 moduleinfo.json is required' }
          python scripts/normalize_vst3_moduleinfo.py --self-test
          python scripts/normalize_vst3_moduleinfo.py "$info"
          $metadata = Get-Content -LiteralPath $info -Raw | ConvertFrom-Json -ErrorAction Stop
          if ($metadata.Name -ne 'Skelly EQ') { throw "Unexpected VST3 product name: $($metadata.Name)" }
          if ([string]::IsNullOrWhiteSpace([string]$metadata.Version) -or $metadata.Version -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Invalid VST3 semantic version: $($metadata.Version)"
          }
          if ($metadata.'Factory Info'.Vendor -ne 'Skelly Audio') { throw 'Unexpected VST3 vendor identity' }
          $classes = @($metadata.Classes)
          if ($classes.Count -lt 1) { throw 'VST3 metadata contains no classes' }
          $ids = @($classes | ForEach-Object { [string]$_.CID })
          if (@($ids | Sort-Object -Unique).Count -ne $ids.Count) { throw 'Duplicate VST3 class IDs' }
          foreach ($class in $classes) {
            if ($class.Name -ne 'Skelly EQ' -or $class.Vendor -ne 'Skelly Audio') { throw 'Unexpected VST3 class identity' }
            if ([string]$class.CID -notmatch '^[0-9A-Fa-f]{32}$') { throw "Invalid VST3 CID: $($class.CID)" }
          }

          $standalone = @(Get-ChildItem -Path build -Recurse -File | Where-Object { $_.Name -in @('Skelly EQ.exe','SkellyEQ.exe') })
          if ($standalone.Count -ne 0) { throw 'Unexpected standalone executable in VST3-only build' }

          $binaryHash = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          $metadataHash = (Get-FileHash -LiteralPath $info -Algorithm SHA256).Hash.ToLowerInvariant()
          $stage = Join-Path $PWD 'release-package'
          if (Test-Path $stage) { Remove-Item -LiteralPath $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -LiteralPath $plugin.FullName -Destination (Join-Path $stage 'Skelly EQ.vst3') -Recurse
          $stagedBinary = Join-Path $stage 'Skelly EQ.vst3/Contents/x86_64-win/Skelly EQ.vst3'
          $stagedInfo = Join-Path $stage 'Skelly EQ.vst3/Contents/Resources/moduleinfo.json'
          if ((Get-FileHash -LiteralPath $stagedBinary -Algorithm SHA256).Hash.ToLowerInvariant() -ne $binaryHash) { throw 'Staged VST3 binary hash mismatch' }
          if ((Get-FileHash -LiteralPath $stagedInfo -Algorithm SHA256).Hash.ToLowerInvariant() -ne $metadataHash) { throw 'Staged moduleinfo hash mismatch' }
          @(
            "$binaryHash  Skelly EQ.vst3/Contents/x86_64-win/Skelly EQ.vst3"
            "$metadataHash  Skelly EQ.vst3/Contents/Resources/moduleinfo.json"
          ) | Set-Content -LiteralPath (Join-Path $stage 'SHA256SUMS.txt') -Encoding ascii
          Write-Host "Staged one flat Skelly EQ VST3 bundle; binary SHA256: $binaryHash"

      - name: Validate exact staged VST3 with pluginval
        uses: Tracktion/pluginval/validate@v2.0.0-beta3
        with:
          plugins: release-package/Skelly EQ.vst3
          strictness-level: 5
          pluginval-version: v2.0.0-beta3

      - name: Write release provenance after all validation gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $PWD 'release-package/Skelly EQ.vst3'
          $binary = Join-Path $bundle 'Contents/x86_64-win/Skelly EQ.vst3'
          $info = Join-Path $bundle 'Contents/Resources/moduleinfo.json'
          $metadata = Get-Content -LiteralPath $info -Raw | ConvertFrom-Json -ErrorAction Stop
          $binaryHash = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          $metadataHash = (Get-FileHash -LiteralPath $info -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            schema_version = 1
            product = 'Skelly EQ'
            version = [string]$metadata.Version
            vendor = 'Skelly Audio'
            format = 'VST3'
            platform = 'windows-x64'
            source_commit = $env:SOURCE_COMMIT
            ci_checkout_commit = $env:GITHUB_SHA
            workflow_run_id = $env:GITHUB_RUN_ID
            windows_build = 'passed'
            ctest = 'passed'
            pluginval = @{ strictness_level = 5; result = 'passed'; target = 'release-package/Skelly EQ.vst3' }
            binary_sha256 = $binaryHash
            moduleinfo_sha256 = $metadataHash
            package_status = 'preview-only'
            release_blockers = @(
              'FL Studio scan, automation, save/reopen and old-project compatibility are not yet accepted',
              'Real music VST3 A/B and user listening approval are pending',
              'Vendor URL and support email are empty in moduleinfo.json',
              'Target Windows hardware CPU/latency and preset-state recall are not yet accepted',
              'Third-party licensing, asset attribution, code signing and commercial release approval are pending'
            )
          }
          $manifestPath = Join-Path $PWD 'release-package/build-info.json'
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $manifestPath -Encoding utf8
          $manifestHash = (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content -LiteralPath (Join-Path $PWD 'release-package/SHA256SUMS.txt') -Value "$manifestHash  build-info.json" -Encoding ascii
          Write-Host 'Release provenance written after Windows build, CTest and pluginval strictness 5 passed.'

      - name: Add private-preview installer, notices and release manifests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $PWD 'release-package'
          $toolNames = @('Install-SkellyEQ.ps1', 'INSTALL-WINDOWS.txt', 'THIRD-PARTY-LICENSE-STATUS.txt')
          foreach ($name in $toolNames) {
            Copy-Item -LiteralPath (Join-Path 'release' $name) -Destination (Join-Path $stage $name) -Force
          }
          Copy-Item -LiteralPath 'V270_RELEASE_NOTES.md' -Destination (Join-Path $stage 'RELEASE-NOTES.txt') -Force
          $previewLines = @(
            'SKELLY EQ 2.7.0 — PRIVATE WINDOWS VST3 PREVIEW'
            'This package is unsigned and preview-only; it is not a commercial release.'
            'Use a disposable DAW project. Keep the previous VST3 and the generated backup.'
            'FL Studio host acceptance, real musical A/B, target-hardware CPU/latency,'
            'licensing/attribution, vendor contact metadata and owner approval remain open.'
            'SHA-256 manifests detect accidental corruption; they are not digital signatures.'
          )
          [System.IO.File]::WriteAllLines((Join-Path $stage 'PREVIEW-ONLY.txt'), [string[]]$previewLines, [System.Text.UTF8Encoding]::new($false))

          $bundle = Join-Path $stage 'Skelly EQ.vst3'
          $binary = Join-Path $bundle 'Contents/x86_64-win/Skelly EQ.vst3'
          $info = Join-Path $bundle 'Contents/Resources/moduleinfo.json'
          $metadata = [System.IO.File]::ReadAllText($info) | ConvertFrom-Json -ErrorAction Stop
          $binaryHash = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          $metadataHash = (Get-FileHash -LiteralPath $info -Algorithm SHA256).Hash.ToLowerInvariant()
          $classIds = @($metadata.Classes | ForEach-Object { [string]$_.CID } | Sort-Object)
          $verification = [ordered]@{
            schema_version = 1
            product = 'Skelly EQ'
            vendor = 'Skelly Audio'
            version = [string]$metadata.Version
            source_moduleinfo_sha256 = $metadataHash
            staged_moduleinfo_sha256 = $metadataHash
            staged_moduleinfo_bytes = (Get-Item -LiteralPath $info).Length
            class_ids = $classIds
          }
          $verification | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $stage 'Skelly-EQ-moduleinfo-verification.json') -Encoding utf8
          [System.IO.File]::WriteAllText((Join-Path $stage 'Skelly-EQ-Windows-VST3.sha256'), ("$binaryHash  Skelly EQ.vst3/Contents/x86_64-win/Skelly EQ.vst3" + [Environment]::NewLine), [System.Text.Encoding]::ASCII)
          $manifestLines = @(
            'Product: Skelly EQ'
            "Version: $($metadata.Version)"
            'Format: VST3'
            'Platform: Windows x86_64'
            "Source head commit: $env:SOURCE_COMMIT"
            "Tested workflow commit: $env:GITHUB_SHA"
            "Workflow run ID: $env:GITHUB_RUN_ID"
            "Binary SHA-256: $binaryHash"
          )
          [System.IO.File]::WriteAllLines((Join-Path $stage 'Skelly-EQ-Windows-VST3-manifest.txt'), [string[]]$manifestLines, [System.Text.Encoding]::UTF8)

          $toolLines = foreach ($name in $toolNames) {
            $file = Join-Path $stage $name
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          [System.IO.File]::WriteAllLines((Join-Path $stage 'TOOLS-SHA256SUMS.txt'), [string[]]$toolLines, [System.Text.Encoding]::ASCII)

          $excluded = @('SHA256SUMS.txt', 'TOOLS-SHA256SUMS.txt') + $toolNames
          $mainFiles = @(Get-ChildItem -LiteralPath $stage -Recurse -File -Force | Where-Object {
            $relative = $_.FullName.Substring($stage.Length).TrimStart([char[]]@('\', '/')).Replace('\', '/')
            $relative -notin $excluded
          } | Sort-Object FullName)
          $mainLines = foreach ($file in $mainFiles) {
            $relative = $file.FullName.Substring($stage.Length).TrimStart([char[]]@('\', '/')).Replace('\', '/')
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $relative"
          }
          [System.IO.File]::WriteAllLines((Join-Path $stage 'SHA256SUMS.txt'), [string[]]$mainLines, [System.Text.Encoding]::ASCII)
          Write-Host "Preview package complete: $($mainFiles.Count) main payload entries and $($toolLines.Count) installer/tool entries."

      - name: Test safe per-user install, update, backup and rollback
        shell: pwsh
        run: pwsh -NoProfile -File release/Test-Install-SkellyEQ.ps1 -PackageRoot release-package

      - uses: actions/upload-artifact@v6
        with:
          retention-days: 14
          name: SkellyEQ-V2.7-Windows-VST3
          path: release-package/
          if-no-files-found: error
) { throw "Could not resolve a full source commit SHA: $sourceCommit" }
